name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Le connecteur Docker interne de Nexus (port 8082) n'a jamais été
  # exposé en TLS -- nginx le reverse-proxifie désormais en HTTPS sur un
  # port dédié (8446) plutôt que sur son propre port, qui reste réservé
  # au trafic interne loopback.
  NEXUS_REGISTRY: nexus.wouri.tv:8446
  IMAGE_PREFIX: vireel

# Security: least-privilege default for GITHUB_TOKEN. This pipeline only
# builds/tests and pushes images to an external (Nexus) registry -- it
# never needs to write to this GitHub repository itself.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------
  # 1. BUILD + UNIT TESTS + SONARQUBE
  # ---------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            path: dashboard
          - service: backend
            path: .
          - service: renderer
            path: render-service

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour l'analyse SonarQube

      # ---------------------------------------------------
      # PARTIE NODE.JS (frontend et renderer)
      # ---------------------------------------------------
      - name: Setup Node.js
        if: matrix.service != 'backend'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Installer les dépendances JS
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Lancer les tests unitaires JS (avec coverage)
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.path }}
        run: |
          if npm run | grep -q '^  test$'; then
            npm run test -- --coverage
          else
            echo "⚠️ Aucun script 'test' défini dans ${{ matrix.path }}/package.json — étape ignorée"
          fi

      - name: Build JS
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.path }}
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # ---------------------------------------------------
      # PARTIE PYTHON (backend, à la racine)
      # ---------------------------------------------------
      - name: Setup Python
        if: matrix.service == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU-only PyTorch
        if: matrix.service == 'backend'
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        if: matrix.service == 'backend'
        run: |
          pip install --no-cache-dir -r ${{ matrix.path }}/requirements.txt

      - name: Installer les dépendances Python & lancer les tests
        if: matrix.service == 'backend'
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml

      # ---------------------------------------------------
      # ANALYSE SONARQUBE (tous les services)
      # ---------------------------------------------------
      - name: Analyse SonarQube
        uses: sonarsource/sonarqube-scan-action@v3
        with:
          projectBaseDir: ${{ matrix.path }}
          args: >
            -Dsonar.projectKey=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
            -Dsonar.projectName=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
            -Dsonar.ws.timeout=60
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      - name: Quality Gate SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: ${{ matrix.path }}/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------
  # 2. BUILD DES IMAGES DOCKER + PUSH VERS NEXUS
  # ---------------------------------------------------------
  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            path: dashboard
            dockerfile: dashboard/Dockerfile
          - service: backend
            path: .
            dockerfile: Dockerfile
          - service: renderer
            path: .
            dockerfile: render-service/Dockerfile

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Audit finding H11 (résolu) : le registre Nexus sert désormais du
      # HTTPS valide via nginx sur nexus.wouri.tv:8446 (voir NEXUS_REGISTRY
      # ci-dessus -- le connecteur Docker interne de Nexus, port 8082,
      # n'a lui jamais été exposé en TLS et reste réservé au loopback),
      # donc docker/buildx n'ont plus besoin de la configuration
      # insecure-registries qui était ici auparavant -- ce contournement
      # est retiré volontairement ; ne le réintroduire que si le registre
      # revient un jour derrière une adresse sans TLS.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login sur le registry Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # Versioning strategy: every push to main overwrites the single
      # `:snapshot` tag for each module (backend/frontend/renderer) --
      # there is deliberately no per-commit SHA tag anymore, since that was
      # exactly what filled Nexus with an ever-growing list of images that
      # were never cleaned up. The commit is instead recorded as an OCI
      # label on the image itself (inspectable via `docker inspect`, or
      # `crane config`/`skopeo inspect` against the registry, without
      # needing a dedicated tag). Promoting a validated snapshot to the
      # single `:release` tag happens in the separate promote-release.yml
      # workflow, via `docker buildx imagetools create` (no rebuild, so
      # `:release` is always byte-for-byte the snapshot that was promoted).
      - name: Build et push de l'image Docker (snapshot)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:snapshot
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------
  # 3. DEPLOIEMENT STAGING (toujours le dernier snapshot)
  # ---------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copier les fichiers de déploiement sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.staging.yml"
          target: "/var/apps/vireel"

      # Staging always runs the snapshot -- it's the environment where a
      # newly built snapshot gets validated before someone runs
      # promote-release.yml to turn it into the release that production
      # deploys (see ci-prod.yml).
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEXUS_REGISTRY,IMAGE_PREFIX
          script: |
            cd /var/apps/vireel
            export IMAGE_TAG=snapshot
            echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ env.NEXUS_REGISTRY }} -u ${{ secrets.NEXUS_USERNAME }} --password-stdin
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f