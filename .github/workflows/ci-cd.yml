name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXUS_REGISTRY: 82.112.253.226:8082
  IMAGE_PREFIX: vidora

jobs:
  # ---------------------------------------------------------
  # 1. BUILD + UNIT TESTS + SONARQUBE
  # ---------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            path: dashboard
          - service: backend
            path: .
          - service: renderer
            path: render-service

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour l'analyse SonarQube

      # ---------------------------------------------------
      # PARTIE NODE.JS (frontend et renderer)
      # ---------------------------------------------------
      - name: Setup Node.js
        if: matrix.service != 'backend'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Installer les dépendances JS
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Lancer les tests unitaires JS (avec coverage)
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.path }}
        run: |
          if npm run | grep -q '^  test$'; then
            npm run test -- --coverage
          else
            echo "⚠️ Aucun script 'test' défini dans ${{ matrix.path }}/package.json — étape ignorée"
          fi

      - name: Build JS
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.path }}
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # ---------------------------------------------------
      # PARTIE PYTHON (backend, à la racine)
      # ---------------------------------------------------
      - name: Setup Python
        if: matrix.service == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.path }}/requirements.txt

      - name: Installer les dépendances Python & lancer les tests
        if: matrix.service == 'backend'
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # pytest --cov=.

      # ---------------------------------------------------
      # ANALYSE SONARQUBE (tous les services)
      # ---------------------------------------------------
      - name: Analyse SonarQube
        uses: sonarsource/sonarqube-scan-action@v3
        with:
          projectBaseDir: ${{ matrix.path }}
          args: >
            -Dsonar.projectKey=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
            -Dsonar.projectName=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: ${{ matrix.path }}/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------
  # 2. BUILD DES IMAGES DOCKER + PUSH VERS NEXUS
  # ---------------------------------------------------------
  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            path: dashboard
            dockerfile: dashboard/Dockerfile
          - service: backend
            path: .
            dockerfile: Dockerfile
          - service: renderer
            path: .
            dockerfile: render-service/Dockerfile

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ env.NEXUS_REGISTRY }}"]
              http = true
              insecure = true

      - name: Autoriser le registry Nexus en HTTP (insecure)
        run: |
          echo '{"insecure-registries":["${{ env.NEXUS_REGISTRY }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login sur le registry Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------
  # 3. DEPLOIEMENT SUR LE VPS
  # ---------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copier les fichiers de déploiement sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/apps/vidora"

      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEXUS_REGISTRY,IMAGE_PREFIX,GITHUB_SHA
          script: |
            cd /var/apps/vidora
            export IMAGE_TAG=${{ github.sha }}
            echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ env.NEXUS_REGISTRY }} -u ${{ secrets.NEXUS_USERNAME }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f