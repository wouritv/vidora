name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXUS_REGISTRY: 82.112.253.226:8082
  IMAGE_PREFIX: vidora

jobs:
  # ---------------------------------------------------------
  # 1. BUILD + UNIT TESTS + SONARQUBE
  # ---------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, renderer]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour l'analyse SonarQube

      # ---------------------------------------------------
      # PARTIE NODE.JS (uniquement pour frontend et renderer)
      # ---------------------------------------------------
      - name: Setup Node.js
        if: matrix.service != 'backend'
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Utilisation de Node 22 (LTS recommandé)
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Installer les dépendances JS
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lancer les tests unitaires JS (avec coverage)
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.service }}
        run: npm run test -- --coverage

      - name: Build JS
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.service }}
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # ---------------------------------------------------
      # PARTIE PYTHON (uniquement pour le backend)
      # ---------------------------------------------------
      - name: Setup Python
        if: matrix.service == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances Python & lancer les tests
        if: matrix.service == 'backend'
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ajoutez votre commande de test python si vous en avez (ex: pytest)
          # pytest --cov=.

      # ---------------------------------------------------
      # ANALYSE SONARQUBE (pour tous les services)
      # ---------------------------------------------------
      - name: Analyse SonarQube
        uses: sonarsource/sonarqube-scan-action@v3
        with:
          projectBaseDir: ${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------
  # 2. BUILD DES IMAGES DOCKER + PUSH VERS NEXUS
  # ---------------------------------------------------------
  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [frontend, backend, renderer]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login sur le registry Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------
  # 3. DEPLOIEMENT SUR LE VPS
  # ---------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copier les fichiers de déploiement sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/myapp" # Harmonisé avec le script SSH ci-dessous

      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEXUS_REGISTRY,IMAGE_PREFIX,GITHUB_SHA
          script: |
            cd /opt/myapp
            export IMAGE_TAG=${{ github.sha }}
            echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ env.NEXUS_REGISTRY }} -u ${{ secrets.NEXUS_USERNAME }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f