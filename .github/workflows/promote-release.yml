name: Promote snapshot to release

# Turns the current `:snapshot` image of each module into the single
# `:release` image, without rebuilding anything: `docker buildx imagetools
# create` just points the `:release` tag at the exact same manifest/digest
# already pushed as `:snapshot`, so what goes to production is guaranteed
# to be byte-for-byte what was validated on staging (see ci-cd.yml).
#
# This also enforces "only one release version exists": pushing to the
# `:release` tag again simply moves that single tag to the new digest --
# it never creates a second, separately-named release image in Nexus.
#
# Trigger it either:
#   - manually, from the Actions tab (workflow_dispatch), once staging has
#     been validated; or
#   - by publishing a GitHub Release -- handy if you want "cut a release"
#     to also mean "promote what's on staging" in one action.

on:
  workflow_dispatch: {}
  release:
    types: [published]

env:
  NEXUS_REGISTRY: nexus.wouri.tv:8446
  IMAGE_PREFIX: vireel

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, renderer]

    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login sur le registry Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Promouvoir snapshot -> release (${{ matrix.service }})
        run: |
          set -euo pipefail
          IMAGE="${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}"

          echo "Résolution du digest actuel de ${IMAGE}:snapshot..."
          docker buildx imagetools inspect "${IMAGE}:snapshot"

          echo "Promotion de ${IMAGE}:snapshot vers ${IMAGE}:release..."
          docker buildx imagetools create --tag "${IMAGE}:release" "${IMAGE}:snapshot"

          echo "Vérification de ${IMAGE}:release..."
          docker buildx imagetools inspect "${IMAGE}:release"
