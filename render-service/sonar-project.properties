sonar.projectKey=vidora-renderer
sonar.projectName=Vidora Renderer

# Code source à analyser
sonar.sources=src
sonar.tests=src

# Fichiers de test (à adapter selon vitest/jest)
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Exclusions communes
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Rapport de couverture (format lcov, si un jour des tests sont ajoutés)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript : indique où trouver le tsconfig pour une analyse plus précise
sonar.typescript.tsconfigPath=tsconfig.json

sonar.sourceEncoding=UTF-8