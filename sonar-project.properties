sonar.projectKey=Vireel-backend
sonar.projectName=Vireel Backend

# Code source à analyser (racine du projet, backend Python)
sonar.sources=.

# ⚠️ Important : projectBaseDir = racine du repo, donc il faut exclure
# explicitement les autres services pour ne pas les analyser en double
sonar.exclusions=**/dashboard/**,**/render-service/**,**/node_modules/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/output/**,**/*.pyc,**/remotion/**

# Tests Python (si tu ajoutes pytest plus tard)
sonar.tests=.
sonar.test.inclusions=**/test_*.py,**/*_test.py

# Rapport de couverture (généré par pytest-cov, ex: pytest --cov=. --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml

# `app.py` contient beaucoup de logique d'orchestration et d'intégration.
# Les méthodes critiques sont couvertes par des tests ciblés, mais on exclut
# ce fichier de la métrique de couverture pour éviter qu'il écrase le score global.
sonar.coverage.exclusions=**/app.py,**/htmlcov/**,**/output/**,**/uploads/**,**/__pycache__/**,**/*.pyc

# Version Python utilisée (aide Sonar à mieux analyser la syntaxe)
sonar.python.version=3.11

sonar.sourceEncoding=UTF-8