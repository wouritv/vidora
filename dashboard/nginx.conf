# Docker's embedded DNS (127.0.0.11) so `backend`/`renderer` below are
# re-resolved on every request instead of once at nginx startup -- without
# this, redeploying the backend/renderer container alone (a new IP on the
# compose network) would leave this container silently proxying to a dead
# address until nginx itself restarts.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same backend routes the local dev server proxies via vite.config.js's
    # server.proxy (see that file for the canonical list) -- the dashboard
    # calls these as same-origin relative paths (src/config.js's
    # getApiUrl()), so production needs the same reverse-proxying in front
    # of the static build, or every fetch() expecting JSON/video here
    # instead gets this server's index.html fallback (200 OK, HTML) and
    # blows up on response.json() with "Unexpected token '<' ... is not
    # valid JSON".
    location /api {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /videos {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /thumbnails {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /gallery {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /video {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /render {
        set $renderer_upstream http://renderer:3100;
        proxy_pass $renderer_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets (Vite appends a content hash to every filename in
    # dist/assets/) are immutable -- safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached: it references the current
    # hashed asset filenames, and this app deploys a new hash set on every
    # release.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing (react-router-dom, BrowserRouter): any path that
    # doesn't match a real static file or one of the proxied routes above
    # falls back to index.html so deep links like
    # /dashboard/reels/projects/:id refresh correctly instead of 404ing on
    # this static server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
