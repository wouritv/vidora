server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (Vite appends a content hash to every filename in
    # dist/assets/) are immutable -- safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached: it references the current
    # hashed asset filenames, and this app deploys a new hash set on every
    # release.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing (react-router-dom, BrowserRouter): any path that
    # doesn't match a real static file falls back to index.html so deep
    # links like /dashboard/reels/projects/:id refresh correctly instead of
    # 404ing on this static server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
