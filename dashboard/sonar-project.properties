sonar.projectKey=vidora-frontend
sonar.projectName=Vidora Frontend

# Code source à analyser
sonar.sources=src
sonar.tests=src

# Fichiers de test (à adapter selon vitest/jest)
sonar.test.inclusions=**/*.test.jsx,**/*.test.js,**/*.spec.jsx,**/*.spec.js

# Exclusions communes
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.config.js,**/vite-env.d.ts,**/src/assets/**,,**/src/components/**,**/src/layouts/**,**/src/pages/**,**/src/remotion/**,**/src/state/**,**/src/style/**,**/src/App.jxs

# Rapport de couverture (généré par vitest --coverage, format lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8