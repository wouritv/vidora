## Fichier de config pour le deploiement de l'application sur le VPS
## Pour deploiement dans un environnement donne (Staging ou prod), modifier le port ainsi que le container_name et c'est correct
##
## La prod ne suit que la seule version `release` (voir
## .github/workflows/promote-release.yml pour la promotion d'un snapshot
## valide en release, et ci-prod.yml pour le deploiement). IMAGE_TAG=release
## par defaut ci-dessous ; ne jamais pointer ce fichier vers `snapshot` ou un
## SHA de commit.

services:
  backend:
    image: ${NEXUS_REGISTRY}/${IMAGE_PREFIX}-backend:${IMAGE_TAG:-release}
    container_name: vireel-prod-backend
    ports:
      - "5000:8000"
    volumes:
      - output-data:/app/output
      - /var/apps/secrets/cookies.txt:/app/cookies.txt
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - prod-network
    # Security: cap resource usage so a single abusive/misbehaving job can't
    # exhaust host memory/CPU and starve the other services on the VPS
    # (audit finding H14).
    mem_limit: ${BACKEND_MEM_LIMIT:-4g}
    cpus: ${BACKEND_CPU_LIMIT:-4}

  frontend:
    image: ${NEXUS_REGISTRY}/${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-release}
    container_name: vireel-prod-frontend
    ports:
      - "5001:8080"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - prod-network
    mem_limit: ${FRONTEND_MEM_LIMIT:-1g}
    cpus: ${FRONTEND_CPU_LIMIT:-1}

  renderer:
    image: ${NEXUS_REGISTRY}/${IMAGE_PREFIX}-renderer:${IMAGE_TAG:-release}
    container_name: vireel-prod-renderer
    ports:
      # Bound to loopback only: render-service has no per-user auth of its
      # own and must only be reachable from the backend over the internal
      # Docker network, never from the public internet.
      - "127.0.0.1:5002:3100"
    volumes:
      - output-data:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
      - RENDER_SERVICE_API_KEY=${RENDER_SERVICE_API_KEY:?RENDER_SERVICE_API_KEY must be set}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - prod-network
    mem_limit: ${RENDERER_MEM_LIMIT:-4g}
    cpus: ${RENDERER_CPU_LIMIT:-4}

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: vireel-prod-pot-provider
    restart: unless-stopped
    networks:
      - prod-network
    mem_limit: ${POT_PROVIDER_MEM_LIMIT:-512m}
    cpus: ${POT_PROVIDER_CPU_LIMIT:-1}

volumes:
  output-data:

networks:
  prod-network:
    driver: bridge